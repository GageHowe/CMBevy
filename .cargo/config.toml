
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[profile.dev]
opt-level = 0
lto = false
#codegen-units = 1024

[profile.release]
opt-level = 3
#debug = true
lto = "thin"
strip = true
codegen-units = 1

# https://doc.rust-lang.org/beta/unstable-book/compiler-flags/debug_info_for_profiling.html
