[package]
name = "game_objects"
version = "0.1.0"
edition = "2024"

[features]
client = ["bevy/jpeg", "dep:bevy_egui"]

[lints]
workspace = true

[dependencies]
common = { path = "../common" }
physics = { path = "../physics" }
net = { path = "../net" }
bevy = { version = "0.18", features = ["serialize", "std", "multi_threaded"] }
rapier3d = { version = "0.32.0", features = ["simd-stable", "parallel"] }
bevy_egui = { version = "0.39.1", optional = true }
postcard = { version = "1", features = ["alloc"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12.0"
zstd = "0.13.3"
fastrand = "2"
ureq = "2"
sha2 = "0.10.9"
