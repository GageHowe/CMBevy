[package]
name = "session"
version = "0.1.0"
edition = "2024"

[features]
client = ["dep:http_common", "dep:zstd", "dep:ureq"]

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, features = ["serialize", "std", "multi_threaded"] }
common = { path = "../common" }
game_objects = { path = "../game_objects" }
net = { path = "../net" }
physics = { path = "../physics" }
scripting = { path = "../scripting" }
http_common = { path = "../http_common", optional = true }
zstd = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
