[package]
name = "session"
version = "0.1.0"
edition = "2024"

[features]
client = ["dep:zstd", "bevy/3d"]

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, features = ["serialize", "std", "multi_threaded"] }
common = { path = "../common" }
game_objects = { path = "../game_objects" }
pawn = { path = "../pawn" }
net = { path = "../net" }
physics = { path = "../physics" }
scripting = { path = "../scripting" }
http_common = { path = "../http_common" }
zstd = { workspace = true, optional = true }
ureq = { workspace = true }
serde = { workspace = true }
