[package]
name = "master_plugin"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
client = ["gameplay/client"]
server = ["gameplay/server"]

[dependencies]
asset_pak = { path = "../asset_pak", features = ["bevy_reader"] }
gameplay = { path = "../gameplay" }
common = { path = "../common" }
physics = { path = "../physics" }
bevy = { workspace = true, features = ["std", "multi_threaded"] }
