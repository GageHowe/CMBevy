
[package]
name = "common"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# Enables visual/rendering spawning helpers (mesh, material, camera rig).
# Enable this in the client crate; the server omits it.
client = []
server = []

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_log", "multi_threaded"] }
rapier3d = "0.32.0"
bevy_egui = "0.39.1"
wincode = "0.4.1"
wincode-derive = "0.4.0"
zstd = "0.13.3"
bevy_quinnet = { version = "0.20", default-features = false, features = ["client", "server"] }
