[package]
name = "cmbevy"
version = "0.1.0"
edition = "2024"
default-run = "client"

[dependencies]
bevy = { version = "0.18.0", optional = true, default-features = false }
bevy_renet = "4.0.0"
bincode = "3.0.0"
local-ip-address = "0.6.9"
rapier3d = { version = "0.32.0", features = ["simd-stable", "parallel"] }
serde = "1.0.228"

[features]
default = ["client", "server"]

client = [
  "bevy/3d",
  "bevy/ui",
  "bevy/debug"
]

server = []

[[bin]]
name = "client"
path = "src/bin/client.rs"
required-features = ["client"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[profile.dev]
opt-level = 0
[profile.dev.package."*"]
opt-level = 3
