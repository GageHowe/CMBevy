cargo-features = ["codegen-backend"]

[workspace]
members = ["common", "http_common", "gameserver", "client", "beacon", "ktx2conv", "decomp"]
resolver = "3"

[workspace.lints.rust]
#unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
