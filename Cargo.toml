#cargo-features = ["codegen-backend"]

[workspace]
members = ["crates/*", "gameserver", "client", "beacon", "tools/*"]
resolver = "3"

[workspace.lints.rust]

[workspace.lints.clippy]
unwrap_used = "deny"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
unused_results = "deny"

[profile.dev]
opt-level = 1
lto = false
strip = "debuginfo"

[profile.dev.package.rapier3d]
opt-level = 3

[profile.dev.package.parry3d]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3

[profile.dev.package.serde]
opt-level = 3

[profile.dev.package.postcard]
opt-level = 3

[profile.dev.package.zstd]
opt-level = 3

[profile.dev.package.bevy_ecs]
opt-level = 3

[profile.dev.package.bevy_transform]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.distribution]
inherits = "release"
debug = 0
strip = true
