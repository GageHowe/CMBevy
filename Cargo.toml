[package]
name = "cmbevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.0", default-features = false, features = ["bevy_winit", "dev", "scene", "3d_bevy_render", "default_platform", "default_app"] }
# bevy_renet = "4.0.0"
rapier3d = {version = "0.32.0", features = [ "simd-stable", "parallel" ] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
