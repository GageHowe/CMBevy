<section class="stack">
    <h1>Custom Games</h1>
    <p>Browse active player-hosted games and current player counts.</p>
</section>

<section class="stack">
    <div class="row">
        <input
            class="grow"
            type="text"
            placeholder="Search lobbies..."
            id="search"
            oninput="filterLobbies(this.value)"
        />
        <button
            hx-get="/lobbies/partial"
            hx-target="#lobby-grid"
            hx-trigger="click"
            hx-indicator="#spinner"
        >
            Refresh
        </button>
        <span id="spinner" class="htmx-indicator">↻</span>
    </div>

    <div
        id="lobby-grid"
        hx-get="/lobbies/partial"
        hx-trigger="load, every 5s"
        hx-swap="innerHTML"
    >
        <div class="empty">Loading lobbies...</div>
    </div>
</section>
