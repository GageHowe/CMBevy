<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Critical Mass Beacon</title>
        <link rel="stylesheet" href="/theme.css" />
        <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    </head>
    <body>
        <nav>
            <a href="/assets">Beacon</a>
            <div class="row">
                <a class="nav-link" href="/assets">Assets</a>
                <a class="nav-link active" href="/beacon">Lobbies</a>
            </div>
            <span class="status row">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </span>
        </nav>

        <main>
            <section class="stack">
                <h1>Lobbies</h1>
                <p>Browse registered lobbies.</p>
            </section>

            <section class="stack">
                <div class="row">
                    <input
                        class="grow"
                        type="text"
                        placeholder="Search lobbies..."
                        id="search"
                        oninput="filterLobbies(this.value)"
                    />
                    <button
                        hx-get="/lobbies/partial"
                        hx-target="#lobby-grid"
                        hx-trigger="click"
                        hx-indicator="#spinner"
                    >
                        Refresh
                    </button>
                    <span id="spinner" class="htmx-indicator">↻</span>
                </div>

                <div
                    id="lobby-grid"
                    hx-get="/lobbies/partial"
                    hx-trigger="load, every 5s"
                    hx-swap="innerHTML"
                >
                    <div class="empty">Loading lobbies...</div>
                </div>
            </section>
        </main>

        <script>
            async function checkStatus() {
                try {
                    const res = await fetch("/health");
                    const dot = document.getElementById("status-dot");
                    const txt = document.getElementById("status-text");
                    if (res.ok) {
                        dot.className = "status-dot online";
                        txt.textContent = "Online";
                    } else {
                        dot.className = "status-dot offline";
                        txt.textContent = "Offline";
                    }
                } catch {
                    document.getElementById("status-dot").className = "status-dot offline";
                    document.getElementById("status-text").textContent = "Offline";
                }
            }

            function filterLobbies(query) {
                const cards = document.querySelectorAll(".lobby-card");
                cards.forEach((card) => {
                    const name = card.dataset.name.toLowerCase();
                    card.style.display = name.includes(query.toLowerCase()) ? "" : "none";
                });
            }

            checkStatus();
            setInterval(checkStatus, 10000);
        </script>
    </body>
</html>
