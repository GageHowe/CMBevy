<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Critical Mass Assets</title>
        <link rel="stylesheet" href="/theme.css" />
        <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    </head>
    <body>
        <nav>
            <div class="row">
                <a class="nav-link active" href="/assets">Assets</a>
                <a class="nav-link" href="/beacon">Lobbies</a>
            </div>
            <span class="status row">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </span>
        </nav>

        <main>
            <section class="stack">
                <h1>Asset Uploads</h1>
                <p>Upload a file to get a `sha256:...` hash. Map files can reference that hash later.</p>
            </section>

            <section class="stack">
                <h2>Upload</h2>
                <div class="row">
                    <input id="asset-file" class="hidden" type="file" onchange="updateSelectedFile()" />
                    <button type="button" class="ghost" onclick="document.getElementById('asset-file').click()">Choose file</button>
                    <span id="selected-file" class="status">No file selected.</span>
                </div>
                <div class="row">
                    <button id="upload-button" type="button" onclick="uploadSelectedFile()">Upload</button>
                </div>
                <p id="upload-status" class="muted">No upload in progress.</p>
                <div id="upload-result" class="stack" hidden>
                    <label for="asset-hash">Hash</label>
                    <input id="asset-hash" class="grow" type="text" readonly />
                </div>
            </section>

            <section class="stack">
                <div class="footer">
                    <h2>Uploaded Files</h2>
                    <button
                        type="button"
                        class="ghost"
                        hx-get="/assets/list"
                        hx-include="#asset-filter"
                        hx-target="#asset-list"
                        hx-indicator="#asset-spinner"
                    >
                        Refresh
                    </button>
                </div>
                <div class="row">
                    <input
                        class="grow"
                        id="asset-filter"
                        name="q"
                        type="text"
                        placeholder="Filter by name or hash..."
                        hx-get="/assets/list"
                        hx-trigger="load, input changed delay:200ms"
                        hx-target="#asset-list"
                        hx-indicator="#asset-spinner"
                    />
                    <span id="asset-spinner" class="htmx-indicator">↻</span>
                </div>
                <div id="asset-list">
                    <div class="empty">Loading assets...</div>
                </div>
            </section>
        </main>

        <script>
            async function checkStatus() {
                try {
                    const res = await fetch("/health");
                    const dot = document.getElementById("status-dot");
                    const txt = document.getElementById("status-text");
                    if (res.ok) {
                        dot.className = "status-dot online";
                        txt.textContent = "Online";
                    } else {
                        dot.className = "status-dot offline";
                        txt.textContent = "Offline";
                    }
                } catch {
                    document.getElementById("status-dot").className = "status-dot offline";
                    document.getElementById("status-text").textContent = "Offline";
                }
            }

            async function uploadSelectedFile() {
                const input = document.getElementById("asset-file");
                const status = document.getElementById("upload-status");
                const result = document.getElementById("upload-result");
                const button = document.getElementById("upload-button");
                const file = input.files[0];
                if (!file) {
                    status.textContent = "Choose a file first.";
                    return;
                }

                button.disabled = true;
                status.textContent = `Uploading ${file.name}...`;
                result.hidden = true;

                try {
                    const response = await fetch("/assets", {
                        method: "POST",
                        headers: { "x-asset-filename": file.name },
                        body: await file.arrayBuffer(),
                    });
                    if (!response.ok) {
                        throw new Error(`Upload failed with ${response.status}`);
                    }
                    const payload = await response.json();
                    document.getElementById("asset-hash").value = payload.hash;
                    status.textContent = `${payload.file_name} uploaded successfully.`;
                    result.hidden = false;
                    reloadAssets();
                } catch (error) {
                    status.textContent = error.message;
                } finally {
                    button.disabled = false;
                }
            }

            function updateSelectedFile() {
                const file = document.getElementById("asset-file").files[0];
                document.getElementById("selected-file").textContent = file
                    ? file.name
                    : "No file selected.";
            }

            async function voteAsset(hash, vote) {
                await fetch(`/assets/${hash}/vote/${vote}`, { method: "POST" });
                reloadAssets();
            }

            async function copyAssetHash(hash) {
                await navigator.clipboard.writeText(hash);
            }

            function reloadAssets() {
                htmx.ajax(
                    "GET",
                    "/assets/list?q=" +
                        encodeURIComponent(
                            document.getElementById("asset-filter").value,
                        ),
                    "#asset-list",
                );
            }

            checkStatus();
            setInterval(checkStatus, 10000);
        </script>
    </body>
</html>
