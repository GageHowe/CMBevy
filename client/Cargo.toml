[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
common = { path = "../common" }
bevy = { version = "0.18", default-features = false, features = ["jpeg", "std", "multi_threaded"] }
bevy_egui = "0.39.1"
zstd = "0.13.3"
rapier3d = { version = "0.32.0", features = ["simd-stable", "parallel"] }
steamworks = "0.12"
serde = { version = "1", features = ["derive"] }
dirs = "6.0.0"
toml = { version = "1.0.6", features = ["preserve_order"] }
